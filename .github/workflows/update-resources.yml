name: Character Resource Candidates

on:
  workflow_dispatch:
    inputs:
      group:
        description: "资源组通配符，留空扫描两服共有立绘"
        required: false
        default: ""
        type: string
  schedule:
    # UTC 08:00，即北京时间 16:00；生成候选配置和预览供复核。
    - cron: "0 8 * * *"

concurrency:
  group: character-resource-candidates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache official resources
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/character-resources
            ~/.local/share/baad
          key: character-resources-${{ runner.os }}-${{ hashFiles('config/download-tools.json', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            character-resources-${{ runner.os }}-${{ hashFiles('config/download-tools.json', 'requirements.txt') }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused tests
        run: python -m unittest discover -s tests -v

      - name: Scan changed character resources
        env:
          TARGET_GROUP: ${{ inputs.group }}
        run: |
          if [ -n "$TARGET_GROUP" ]; then
            python scripts/scan_character_resources.py --group "$TARGET_GROUP"
          else
            python scripts/scan_character_resources.py
          fi

      - name: Save candidate and validation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: character-resources-${{ github.run_id }}
          path: |
            reports/resource-diff.json
            reports/resource-diff-characters.json
            .cache/character-resources/scan-previews/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
